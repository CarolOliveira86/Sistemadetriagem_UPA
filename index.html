<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Triagem - Upa São Camilo | Regional Curitiba/PR</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Cabeçalho -->
  <header class="main-header">
    <div class="brand">
      <div class="brand-logo">+</div>
      <h2>Upa São Camilo — Triagem</h2>
    </div>
    <div class="nurse-info">
      <span>Enfermeiro(a) Responsável: <input type="text" placeholder="Nome da Enfermeiro(a)"></span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container">

    <!-- Formulário Principal de Triagem -->
    <section class="card">
      <h3 class="card-title">Ficha de Classificação de Risco</h3>

      <form id="triagem-form">
        <div class="form-grid">

          <div class="form-group">
            <label for="nome">Nome Completo do Paciente</label>
            <input type="text" id="nome" placeholder="Ex: João da Silva" required>
          </div>

          <div class="form-group">
            <label for="cpf">CPF ou Documento *</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite o CPF completo no formato: 000.000.000-00">
          </div>

          <div class="form-group">
            <label for="pressao">Pressão Arterial (PA) *</label>
            <input type="text" id="pressao" placeholder="120/80 mmHg" required pattern="\d{2,3}\/\d{2,3}(\s?mmHg)?" title="Digite a pressão no formato: 120/80 ou 120/80 mmHg">
          </div>

          <div class="form-group">
            <label for="temp">Temperatura (°C)</label>
            <input type="text" step="0.1" id="temp" placeholder="Ex: 36.5" required pattern="\d{1,2}(\.\d)?" title="Digite a temperatura no formato: 36.5">
          </div>

          <div class="form-group">
            <label for="sat">Saturação de O₂ (%)</label>
            <input type="number" id="sat" placeholder="Ex: 98" required>
          </div>

          <div class="form-group">
            <label for="frequencia">Freq. Cardíaca (BPM)</label>
            <input type="number" id="frequencia" placeholder="Ex: 80" required>
          </div>

          <div class="form-group full-width">
            <label for="queixa">Queixa Principal / Sintomas</label>
            <textarea id="queixa" rows="3" placeholder="Descreva os sintomas relatados pelo paciente..."></textarea>
          </div>

          <!-- Seleção Protocolo de Manchester -->
          <div class="form-group full-width">
            <label>Nível de Urgência (Protocolo de Manchester)</label>
            <div class="urgency-selector">

              <div class="urgency-option">
                <input type="radio" name="urgencia" id="u1" value="red">
                <label for="u1" class="urgency-label u-red">
                  <span>Emergência</span>
                  <small>Imediato</small>
                </label>
              </div>

              <div class="urgency-option">
                <input type="radio" name="urgencia" id="u2" value="orange">
                <label for="u2" class="urgency-label u-orange">
                  <span>Muito Urgente</span>
                  <small>10 min</small>
                </label>
              </div>

              <div class="urgency-option">
                <input type="radio" name="urgencia" id="u3" value="yellow">
                <label for="u3" class="urgency-label u-yellow">
                  <span>Urgente</span>
                  <small>60 min</small>
                </label>
              </div>

              <div class="urgency-option">
                <input type="radio" name="urgencia" id="u4" value="green">
                <label for="u4" class="urgency-label u-green">
                  <span>Pouco Urgente</span>
                  <small>120 min</small>
                </label>
              </div>

              <div class="urgency-option">
                <input type="radio" name="urgencia" id="u5" value="blue">
                <label for="u5" class="urgency-label u-blue">
                  <span>Não Urgente</span>
                  <small>240 min</small>
                </label>
              </div>

            </div>
          </div>

        </div>

        <button type="submit" class="btn-submit">Finalizar Triagem e Encaminhar</button>
      </form>
    </section>

    <!-- Fila de Espera Lateral -->
    <aside class="card">
      <h3 class="card-title">Fila de Atendimento Médico</h3>

      <div class="queue-list" id="queue-list">
      </div>
    </aside>

  </main>

  <script src="script.js"></script>
</body>

</html>
